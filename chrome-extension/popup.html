<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>seek — session</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="masthead">
    <span class="brand-mark" aria-hidden="true">
      <img src="icons/logo.png" alt="">
    </span>
    <span>
      <h1>Session Export</h1>
      <p class="sub">seek · made by Hyperion</p>
    </span>
    <span id="poolLine" class="pool" data-state="off" title="Logins in the proxy pool">proxy offline</span>
  </header>

  <!-- Which upstream this capture is for. Both are stored separately, so switching
       never overwrites the other provider's session. -->
  <section class="provider-switch" role="tablist" aria-label="Provider">
    <button type="button" class="provider-btn is-active" role="tab" aria-selected="true" data-provider="deepseek">DeepSeek</button>
    <button type="button" class="provider-btn" role="tab" aria-selected="false" data-provider="claude">Claude</button>
    <button type="button" class="provider-btn" role="tab" aria-selected="false" data-provider="grok">Grok</button>
  </section>

  <!-- Google Sign-In banner (shown when not signed in) -->
  <section id="googleSignInSection" class="google-signin-section" hidden>
    <p class="signin-hint">Sign in to DeepSeek via Google to capture your session</p>
    <button type="button" id="btnGoogleSignIn" class="btn btn-google">
      <svg class="icon google-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      <span class="btn-label">Sign in with Google</span>
    </button>
  </section>

  <section id="callout" class="callout" hidden>
    <span class="status-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M12 3a9 9 0 1 1-9 9 9 9 0 0 1 9-9Z"/>
        <path class="status-default" d="M12 8v4.5M12 16h.01"/>
        <path class="status-ready" d="m8.5 12 2.3 2.3 4.8-5"/>
      </svg>
    </span>
    <span class="status-copy">
      <strong id="calloutTitle" class="callout-title"></strong>
      <span id="calloutBody" class="callout-body"></span>
    </span>
  </section>

  <button type="button" id="btnCollect" class="btn btn-filled">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M5 12.5V7a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v5.5M8 12l4 4 4-4M12 5v11M6 19h12"/>
    </svg>
    <span class="btn-label">Read current tab</span>
  </button>

  <section class="checks" aria-label="Session status">
    <div class="check">
      <span class="check-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </span>
      <span class="label">Account</span>
      <span id="rowUser" class="value">Not read</span>
    </div>
    <div class="check" id="checkToken">
      <span class="check-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M8.5 11V8.5a3.5 3.5 0 0 1 7 0V11M7 11h10v9H7zM12 15v2"/></svg>
      </span>
      <span class="label">Token</span>
      <span id="rowToken" class="value">Not read</span>
    </div>
    <div class="check">
      <span class="check-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-7-7c0 2 1 3 3 3 0 2 1 3 4 3Z"/><path d="M8.5 13.5h.01M12.5 16.5h.01M14.5 12.5h.01"/></svg>
      </span>
      <span class="label">Cookies</span>
      <span id="rowCookie" class="value">Not read</span>
    </div>
    <div class="check">
      <span class="check-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h10M4 17h7"/><path d="M17 15.5 19 17.5 22 14"/></svg>
      </span>
      <span class="label">Capture</span>
      <span id="rowSource" class="value">Not read</span>
    </div>
    <!-- What the proxy reports for this login: upstream quota windows where the provider
         publishes them (claude.ai 5h/7d), otherwise the gateway's own 5h/24h counters. -->
    <div class="check" id="checkLimits" hidden>
      <span class="check-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 16v-5M12.5 16V8M17 16v-3"/></svg>
      </span>
      <span class="label">Limits</span>
      <span id="rowLimits" class="value">—</span>
    </div>
  </section>

  <!-- A login the cookies API cannot see (container tab, second profile, partitioned
       cookie) still works once pasted: the jar is the credential either way. -->
  <section id="pasteSection" class="paste" hidden>
    <label class="paste-label" for="pasteCookie">Cookie not readable? Paste it</label>
    <textarea id="pasteCookie" class="paste-input" rows="3" spellcheck="false"
      placeholder="sessionKey=… ; cf_clearance=…  (or sso=… for grok.com)"></textarea>
    <div class="paste-actions">
      <button type="button" id="btnPasteSave" class="btn btn-secondary">
        <span class="btn-label">Use this cookie</span>
      </button>
      <span class="paste-hint" id="pasteHint">claude.ai → DevTools → Application → Cookies → copy <code>sessionKey</code></span>
    </div>
  </section>

  <label class="toggle" id="autoPushRow" for="chkAutoPush">
    <input type="checkbox" id="chkAutoPush" checked>
    <span class="toggle-text">Push to the proxy as soon as a session is captured</span>
  </label>

  <label class="toggle" id="signOutRow" for="chkSignOut">
    <input type="checkbox" id="chkSignOut" checked>
    <span class="toggle-text">Sign this browser out of DeepSeek after adding it to the proxy</span>
  </label>

  <div class="actions">
    <button type="button" id="btnCopy" class="btn btn-secondary" disabled>
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>
      </svg>
      <span class="btn-label">Copy</span>
    </button>
    <button type="button" id="btnSave" class="btn btn-secondary" disabled>
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 3v12M7.5 10.5 12 15l4.5-4.5M5 20h14"/>
      </svg>
      <span class="btn-label">Download</span>
    </button>
    <button type="button" id="btnPush" class="btn btn-secondary btn-push" disabled>
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2v10M8 8l4-4 4 4M4 14v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/>
      </svg>
      <span class="btn-label">Push to Proxy</span>
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
