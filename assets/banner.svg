<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="seek — a self-hosted gateway to DeepSeek web, drawn as a heartbeat that flatlines">
  <defs>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3b30" stop-opacity="0.15"/>
      <stop offset="0.12" stop-color="#ff3b30" stop-opacity="1"/>
      <stop offset="0.78" stop-color="#ff3b30" stop-opacity="1"/>
      <stop offset="1" stop-color="#ff3b30" stop-opacity="0.25"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.18" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.045"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="260" fill="#050506"/>
  <rect width="1200" height="260" fill="url(#grid)"/>
  <rect width="1200" height="260" fill="url(#glow)"/>

  <text x="64" y="134" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
