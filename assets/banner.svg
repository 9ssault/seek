  <text x="68" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="12" letter-spacing="4.5" fill="#8a8a93">DEEPSEEK WEB · SELF-HOSTED · OPENAI-COMPATIBLE</text>

  <g fill="none" stroke="url(#pulse)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M620 112 H706 l14 -54 l16 88 l12 -34 H790"/>
    <path d="M790 112 H858 l14 -32 l16 50 l12 -18 H932"/>
    <path d="M932 112 H1146"/>
  </g>
  <circle cx="1152" cy="112" r="4.5" fill="#ff3b30"/>
  <circle cx="1152" cy="112" r="12" fill="none" stroke="#ff3b30" stroke-opacity="0.35" stroke-width="1.5"/>

  <text x="1152" y="172" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
